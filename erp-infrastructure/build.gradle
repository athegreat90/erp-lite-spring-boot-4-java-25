plugins {
    id 'java-library'
}

// erp-infrastructure: persistence, external adapters, framework wiring for the app layer.
dependencies {
    api project(':erp-application')

    api 'org.springframework.boot:spring-boot-starter-cache'
    api 'org.springframework.boot:spring-boot-starter-data-jpa'
    api 'org.springframework.boot:spring-boot-starter-data-mongodb'
    api 'org.springframework.boot:spring-boot-starter-data-redis'
    api 'org.springframework.boot:spring-boot-starter-validation'
    api 'org.springframework.boot:spring-boot-starter-web'

    api 'org.postgresql:postgresql:42.7.13'

    api 'software.amazon.awssdk:s3:2.54.7'

    // Jackson binding annotations for the external-API DTOs (databind runs in erp-api).
    api 'com.fasterxml.jackson.core:jackson-annotations'

    testImplementation 'org.springframework.boot:spring-boot-starter-cache-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-mongodb-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-redis-test'
}
