services:
  # PostgreSQL - Transactional database (Orders, Products)
  postgres:
    image: postgres:alpine
    container_name: erp-postgres
    environment:
      POSTGRES_DB: erp_db
      POSTGRES_USER: athegreat
      POSTGRES_PASSWORD: secret
      # Use a subdirectory under the mount point (postgres refuses to init
      # directly into a mount that already contains files, e.g. .gitkeep).
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - ./db/postgresql/init:/docker-entrypoint-initdb.d
      - ./db/postgresql/data:/var/lib/postgresql/data
    networks:
      - erp-vpc
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U athegreat -d erp_db"]
      interval: 10s
      timeout: 5s
      retries: 5
  # MongoDB - Document database (Catalogs, AuditLogs, Product Queries)
  # Note: the official mongo image has no alpine/slim variant, so pin the
  # latest major instead.
  mongodb:
    image: mongo:8
    container_name: erp-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: athegreat
      MONGO_INITDB_ROOT_PASSWORD: secret
      MONGO_INITDB_DATABASE: erp_catalog_db
    ports:
      - "27017:27017"
    volumes:
      - ./db/mongodb/init:/docker-entrypoint-initdb.d
      - ./db/mongodb/data:/data/db
    networks:
      - erp-vpc
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')", "-u",
             "athegreat", "-p", "secret", "--authenticationDatabase", "admin",
             "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
  # Redis - Catalog cache
  redis:
    image: redis:alpine
    container_name: erp-redis
    command: redis-server --requirepass secret --maxmemory 256mb --maxmemory-policy allkeys-lru --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - ./db/redis/data:/data
    networks:
      - erp-vpc
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "secret", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  # LocalStack - Local AWS emulator (S3 for product images)
  localstack:
    # Pin to the last token-free community release. The `latest`/`stable` tags
    # now resolve to calendar-versioned images that quit with exit code 55
    # ("License activation failed") unless LOCALSTACK_AUTH_TOKEN is set.
    image: localstack/localstack:4.5
    container_name: erp-localstack
    ports:
      - "4566:4566"
      - "4510-4559:4510-4559"
    environment:
      SERVICES: s3
      DEBUG: 1
      PERSISTENCE: 1
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: athegreat
      AWS_SECRET_ACCESS_KEY: secret
    volumes:
      - ./db/localstack/data:/var/lib/localstack
    networks:
      - erp-vpc
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
  # One-shot bucket bootstrap: creates the S3 bucket used for product images
  # once LocalStack is healthy. Not a mounted ready.d script, since this repo
  # has core.filemode=false and a chmod +x on such a script wouldn't survive
  # commit/clone (silently breaking bucket creation on a fresh checkout).
  localstack-init:
    image: amazon/aws-cli:latest
    container_name: erp-localstack-init
    depends_on:
      localstack:
        condition: service_healthy
    environment:
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: athegreat
      AWS_SECRET_ACCESS_KEY: secret
    entrypoint: ["sh", "-c"]
    command: >
      "aws --endpoint-url=http://localstack:4566 s3 mb s3://erp-product-images || true"
    networks:
      - erp-vpc

networks:
  erp-vpc:
    name: erp-vpc
    driver: bridge