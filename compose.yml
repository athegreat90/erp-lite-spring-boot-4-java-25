services:
  # PostgreSQL - Transactional database (Orders, Products)
  postgres:
    image: postgres:alpine
    container_name: erp-postgres
    environment:
      POSTGRES_DB: erp_db
      POSTGRES_USER: athegreat
      POSTGRES_PASSWORD: secret
      # Use a subdirectory under the mount point (postgres refuses to init
      # directly into a mount that already contains files, e.g. .gitkeep).
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - ./db/postgresql/init:/docker-entrypoint-initdb.d
      - ./db/postgresql/data:/var/lib/postgresql/data
    networks:
      - erp-vpc
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U athegreat -d erp_db"]
      interval: 10s
      timeout: 5s
      retries: 5
  # MongoDB - Document database (Catalogs, AuditLogs, Product Queries)
  # Note: the official mongo image has no alpine/slim variant, so pin the
  # latest major instead.
  mongodb:
    image: mongo:8
    container_name: erp-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: athegreat
      MONGO_INITDB_ROOT_PASSWORD: secret
      MONGO_INITDB_DATABASE: erp_catalog_db
    ports:
      - "27017:27017"
    volumes:
      - ./db/mongodb/init:/docker-entrypoint-initdb.d
      - ./db/mongodb/data:/data/db
    networks:
      - erp-vpc
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')", "-u",
             "athegreat", "-p", "secret", "--authenticationDatabase", "admin",
             "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
  # Redis - Catalog cache
  redis:
    image: redis:alpine
    container_name: erp-redis
    command: redis-server --requirepass secret --maxmemory 256mb --maxmemory-policy allkeys-lru --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - ./db/redis/data:/data
    networks:
      - erp-vpc
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "secret", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  # LocalStack - Local AWS emulator (S3 for product images)
  localstack:
    # Pin to the last token-free community release. The `latest`/`stable` tags
    # now resolve to calendar-versioned images that quit with exit code 55
    # ("License activation failed") unless LOCALSTACK_AUTH_TOKEN is set.
    image: localstack/localstack:4.5
    container_name: erp-localstack
    # 4566 is the edge port; 4510-4559 is the external-service port range
    # (kept for parity with a full LocalStack setup).
    ports:
      - "4566:4566"
      - "4510-4559:4510-4559"
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: athegreat
      AWS_SECRET_ACCESS_KEY: secret
      # DEBUG=1: verbose LocalStack logs.
      # PERSISTENCE=1 + the ./db/localstack/data volume are meant to keep S3 state
      # across restarts. They are not effective on the community image, so the
      # ready.d init hook below recreates the bucket on every `compose up`.
      DEBUG: 1
      PERSISTENCE: 1
    volumes:
      - ./db/localstack/data:/var/lib/localstack
      # ready.d hook: creates the erp-products-images S3 bucket once LocalStack
      # is ready (replaces the localstack-init container on a default `up`).
      - ./db/localstack/init/ready.d:/etc/localstack/init/ready.d
    networks:
      - erp-vpc
    labels:
      # Spring Boot Docker Compose support (erp-api) TCP-probes every published
      # port; nothing listens on most of 4510-4559, so skip its readiness check
      # for this service. `docker compose up --wait` still gates on the
      # healthcheck below.
      org.springframework.boot.readiness-check.tcp.disable: "true"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
  # Optional one-shot bucket bootstrap, kept for manual/on-demand use:
  #   docker compose --profile init up localstack-init
  # The automatic path is the ready.d hook mounted into the `localstack` service
  # above; this container does the same thing from the outside. It is gated
  # behind the `init` profile so it does NOT run on a bare `docker compose up`
  # (a container that exits 0 makes `docker compose up --wait`, which Spring Boot
  # Docker Compose support runs, fail).
  # Reuses the localstack image (already pulled) for its bundled `awslocal`;
  # LOCALSTACK_HOST points it at the localstack container rather than localhost.
  localstack-init:
    image: localstack/localstack:4.5
    container_name: erp-localstack-init
    profiles: ["init"]
    depends_on:
      localstack:
        condition: service_healthy
    environment:
      LOCALSTACK_HOST: localstack:4566
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: athegreat
      AWS_SECRET_ACCESS_KEY: secret
    entrypoint: ["sh", "-c"]
    command: ["awslocal s3 mb s3://erp-products-images || true"]
    restart: "no"
    networks:
      - erp-vpc

networks:
  erp-vpc:
    name: erp-vpc
    driver: bridge